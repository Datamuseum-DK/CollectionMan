<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:insert="~{layout :: headerFragment (webtitle='Redigere: ' + ${item.headline})}">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" type="text/css" href="../static/css/localstyles.css" th:href="@{/css/localstyles.css}"/>
    <link rel="stylesheet" type="text/css" href="../static/css/tabstyles.css" th:href="@{/css/tabstyles.css}"/>
    <script th:src="@{/js/tabops.js}" src="../static/js/tabops.js"><![CDATA[ ]]></script>
  </head>
  <body>
    <header th:insert="~{layout :: bannerFragment}">
      <h1>
        <a href="index.html">DDHF mobilregistring</a>
      </h1>
    </header>
    <section id="content">
      <h2 th:text="'Redigere ' + ${item.headline}">Redigere genstand</h2>
      <div class="tab">
        <button class="tablinks active" onclick="openTab(event, 'Identifikation')">Identifikation</button>
        <button class="tablinks" onclick="openTab(event, 'Erhvervelse')">Erhvervelse</button>
        <button class="tablinks" onclick="openTab(event, 'Notater')">Notater</button>
        <button class="tablinks" onclick="openTab(event, 'Internt')">Internt</button>
      </div>
      <form id="editfactsheet" method="post" action="items-view.html" th:object="${item}" th:action="@{/items/update/{id}(id=${item.id})}">
        <fieldset id="Identifikation" class="tabcontent" style="display:block">
          <legend>Identifikation</legend>
          <div>
            <label class="leader" for="genstand">Genstand nr.:</label>
            <input id="genstand" name="id" type="text" readonly="readonly" th:field="*{id}" value="11002200"/>
          </div>
          <div>
            <label class="leader required">Type:</label>
            <label th:each="type : ${types}">
              <input type="radio" name="itemClass" value="1" th:field="*{itemClass}" th:value="${type.id}"/>
              <span th:text="${type.name}">Artefakt</span>
            </label>
            <label th:remove="all">
              <input type="radio" name="itemClass" value="2" checked="checked"/>
              <span>Flyttekasse</span>
            </label>
            <label th:remove="all">
              <input type="radio" name="itemClass" value="3"/>
              <span>Palle</span>
            </label>
            <span th:if="${#fields.hasErrors('itemClass')}" th:errors="*{itemClass}" class="fielderror">Error</span>
          </div>
          <div>
            <label class="leader required" for="fileid">Sag:</label>
            <select name="fileid" id="fileid" th:field="*{fileid}" th:readonly="${!casefile.status}">
              <option value="1" th:value="${casefile.id}" th:if="${!casefile.status}" th:text="${casefile.title}">Filetitle</option>
              <option th:if="${casefile.status}" value="15" th:each="c : ${files}" th:value="${c.id}" th:text="${c.title}">ALCATEL effekter</option>
              <option value="61" th:remove="all">Carl Christian Danielsen (2021-2022 donation)</option>
              <option value="29" th:remove="all">Dataco udstyr fra DSB Informatik</option>
            </select>
            <span th:if="${#fields.hasErrors('fileid')}" th:errors="*{fileid}" class="fielderror">Error</span>
          </div>
          <div>
            <label class="leader required" for="id_itemstatus">Status:</label>
            <select th:field="*{itemStatus}" name="itemStatus" id="id_itemstatus">
              <option value="0" th:value="${status.id}" th:text="${status.name}" th:each="status: ${statuses}">Intern</option>
            </select>
            <span th:if="${#fields.hasErrors('itemStatus')}" th:errors="*{itemStatus}" class="fielderror">Error</span>
          </div>
          <div>
            <label class="leader" for="id_subjects">Emnegrupper:</label>
            <select th:field="*{subjects}" id="id_subjects" multiple="multiple" size="8" th:remove="all-but-first">
              <option value="26" th:each="s : ${allSubjects}" th:value="${s.subjectid}" th:text="${s.title}">Abacus</option>
              <option value="30">Analoge regnemaskiner</option>
              <option value="108">Bærbare og mobile enheder</option>
              <option value="21">Billeder</option>
              <option value="10">Bøger</option>
              <option value="72">Centralenheder</option>
              <option value="139">Computerspil</option>
              <option value="118">Dataskærme</option>
              <option value="111">Diskettedrev</option>
              <option value="81">Disketter</option>
              <option value="29">Elektroniske regnemaskiner</option>
              <option value="94">Elektronregnemaskiner</option>
              <option value="107">Hulkort</option>
              <option value="91">Hulkortudstyr</option>
              <option value="135">Hulstrimler</option>
              <option value="93">Hulstrimmeludstyr</option>
              <option value="13">Lærebøger</option>
              <option value="113">Lommeregnere</option>
              <option value="95">Mainframes</option>
              <option value="127">Måleinstrumenter</option>
              <option value="27">Mekaniske regnemaskiner</option>
              <option value="97">Mikrodatamater</option>
              <option value="96">Minidatamater</option>
              <option value="121">Modems</option>
              <option value="130" selected="selected">Paller</option>
              <option value="49">Passive elektroniske komponenter</option>
              <option value="98">Personlige computere</option>
              <option value="106">Plottere</option>
              <option value="80">Printere</option>
              <option value="61">Produktionspapirer</option>
              <option value="109">Programmer og programmel</option>
              <option value="34" selected="selected">Programmerbare regnemaskiner</option>
              <option value="6">Protokoller</option>
              <option value="62">Referenceværker</option>
              <option value="85">Salgsmateriale</option>
              <option value="120">Serverudstyr</option>
              <option value="77">Strimmelhuller</option>
              <option value="76">Tapeenheder</option>
              <option value="105">Tastaturer</option>
              <option value="53">Telefoner og telefonudstyr</option>
              <option value="50">Telegrafudstyr og fjernskrivere</option>
              <option value="102">Terminaludstyr</option>
              <option value="99">Udviklingssystemer</option>
              <option value="66">Virksomhedspapirer</option>
            </select>
          </div>
          <label class="leader required" for="headline">Betegnelse:</label>
          <input type="text" id="headline" value="Xerox 860 tekstbehandlingsanlæg" th:field="*{headline}" class="fullwidth"/>
          <span th:if="${#fields.hasErrors('headline')}" th:errors="*{headline}" class="fielderror">Error</span>
          <div>
            <label class="head" for="description">Beskrivelse:</label>
            <textarea id="description" cols="40" rows="8" th:field="*{description}">Rank Xerox type 860 tekstbehandlingsanlæg med 2 stk 8" diskettedrev, tastatur og skærm.
Product codes X994, X995 og X996.
Serienumre: 1111012438, 131-006077-8, 111-148902-1
Særlige oplysninger: Stammer fra Christian Rovsing A/S. Anlægsaktiv 00092100.</textarea>
          </div>
          <div>
            <label class="leader" for="producent">Producent:</label>
            <select id="producent" th:field="*{producerid}">
              <option value="">-------</option>
              <option value="237" th:each="p : ${producers}" th:value="${p.producerid}" th:text="${p.title}">Motorola micro systems</option>
              <option value="274" th:remove="all">Nixdorf Computer</option>
              <option value="64" selected="selected" th:remove="all">Rank Xerox</option>
              <option value="285" th:remove="all">SC Metric A/S</option>
            </select>
          </div>
          <div>
            <label class="leader" for="itemmodeltype">Model/type:</label>
            <input type="text" id="itemmodeltype" value="" th:field="*{itemmodeltype}"/>
          </div>
          <div>
            <label class="leader" for="itemserialno">Serienummer:</label>
            <input type="text" id="itemserialno" value="" th:field="*{itemserialno}"/>
          </div>
          <div>
            <label class="leader" for="itemsize">Størrelse:</label>
            <input type="text" id="itemsize" value="" th:field="*{itemsize}"/> H/B/D cm
          </div>
          <div>
            <label class="leader" for="itemweight">Vægt:</label>
            <input type="text" id="itemweight" value="" th:field="*{itemweight}"/> Kg.
          </div>
          <div>
            <label class="leader" for="itemdatingfrom">Datering fra: <span th:if="${#fields.hasErrors('itemdatingfrom')}" th:errors="*{itemdatingfrom}" class="fielderror">Error</span></label>
            <input id="itemdatingfrom" type="date" value="1982-10-11" th:field="*{itemdatingfrom}"/>
            <label for="itemdatingto">til:</label>
            <input id="itemdatingto" type="date" value="1982-10-11" th:field="*{itemdatingto}"/>
          </div>
          <div>
            <label class="leader" for="qrcode">QR kode:</label>
            <input type="number" id="qrcode" value="" th:field="*{qrcode}"/>
            <span th:if="${#fields.hasErrors('qrcode')}" th:errors="*{qrcode}" class="fielderror">Error</span>
          </div>
        </fieldset>
        <fieldset id="Erhvervelse" class="tabcontent">
          <legend>Erhvervelse</legend>
          <div>
            <label class="leader required">Måde:</label>
            <label th:each="t : ${acquiretypes}">
              <input name="itemacquiretype" th:field="*{itemacquiretype}" type="radio" value="0" th:value="${t.ordinal}" th:checked="${t.ordinal == itemacquiretype}"/>
              <span th:remove="tag" th:text="${#strings.capitalize(#strings.toLowerCase(t))}">Ukendt</span>
            </label>
            <label th:remove="all"><input name="itemacquiretype" type="radio" value="1" checked="checked"/>Gave</label>
            <label th:remove="all"><input name="itemacquiretype" type="radio" value="3"/>Køb</label>
            <label th:remove="all"><input name="itemacquiretype" type="radio" value="4"/>Deponering</label>
            <span th:if="${#fields.hasErrors('itemacquiretype')}" th:errors="*{itemacquiretype}" class="fielderror">Error</span>
          </div>
          <div>
            <label class="leader" for="donorid">Donator:</label>
            <select id="donorid" th:field="*{donorid}">
              <option value="">-------</option>
              <option value="237" th:each="d : ${donors}" th:value="${d.id}" th:text="${d.displayname}">Motorola micro systems</option>
              <option value="274" th:remove="all">Nixdorf Computer</option>
              <option value="64" selected="selected" th:remove="all">Rank Xerox</option>
              <option value="285" th:remove="all">SC Metric A/S</option>
            </select>
          </div>
          <div>
            <label class="leader" for="itemdepositeduntil" title="Deponeret til museet indtil">Deponeret indtil:</label>
            <input id="itemdepositeduntil" type="date" value="1982-10-11" th:field="*{itemdepositeduntil}"/>
          </div>
          <div>
            <label class="leader" for="itemborroweduntil">Lånt indtil:</label>
            <input id="itemborroweduntil" type="date" value="1982-10-11" th:field="*{itemborroweduntil}"/>
          </div>
          <div>
            <label class="leader" for="itemreceived">Modtagelsesdato:</label>
            <input id="itemreceived" type="date" value="2009-01-30" th:field="*{itemreceived}"/>
            <label for="itemreceivedby">af:</label>
            <input type="text" id="itemreceivedby" value="" th:field="*{itemreceivedby}" size="12"/>
          </div>
        </fieldset>
        <fieldset id="Notater" class="tabcontent">
          <legend>Notater</legend>
          <label class="leader" for="itemusedby">Proviniens/brugsbeskrivelse:</label>
          <textarea id="itemusedby" cols="40" rows="5" th:field="*{itemusedby}" placeholder="Brugt af hvem, til hvad, hvor?">Brugsen</textarea>
          <div>
            <label class="leader" for="itemusedwhereid">Brugslokalitet:</label>
            <select id="itemusedwhereid" th:field="*{itemusedwhereid}">
              <option value="">-------</option>
              <optgroup th:each="loctype : ${localitytypes}" th:label="${loctype.title}" label="Arbejdspladser"
              title="Virksomheder eller divisioner i virksomheder som foretager den samme type arbejde, f.eks. udvikling, service eller hardwareproduktion." th:title="${loctype.description}">
                <option value="10" th:remove="all">Ballerup</option>
                <option value="9" th:each="s : ${loctype.localities}" th:value="${s.id}" th:text="${s.name}" th:selected="${s.id == itemusedwhereid}">København</option>
              </optgroup>
            </select>
          </div>
          <label class="head" for="itemextrainfo">Særlige oplysninger:</label>
          <textarea id="itemextrainfo" cols="40" rows="5" th:field="*{itemextrainfo}">Tekst her</textarea>
          <label class="head" for="itemreferences">Litteraturhenvisninger:</label>
          <textarea id="itemreferences" cols="40" rows="5" th:field="*{itemreferences}">Tekst her</textarea>
        </fieldset>
        <fieldset id="Internt" class="tabcontent">
          <legend>Internt</legend>
          <label class="head" for="itemrestoration">Restaurering:</label>
          <textarea id="itemrestoration" cols="40" rows="5" th:field="*{itemrestoration}" placeholder="Notater om ændringer efter fremstilling: etiketter, tilpasninger, skader, reparationer, m.m.">Tekst her</textarea>
          <label class="head" for="itemremarks">Bemærkninger (intern):</label>
          <textarea id="itemremarks" cols="40" rows="5" th:field="*{itemremarks}">Kommentarer</textarea>
        </fieldset>
        <input type="submit" value="Gem"/>
      </form>
    </section>
    <footer th:replace="~{layout :: footerFragment}">
    Footer
    </footer>
  </body>
</html>
